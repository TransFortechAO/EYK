version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  web:
    build: .
    command: gunicorn EYK.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./:/app:rw
    env_file:
      - ./.env
    ports:
      - '8000:8000'
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A EYK worker -l info -Q default -n worker@%h -P solo
    volumes:
      - ./:/app:rw
    env_file:
      - ./.env
    depends_on:
      - redis

  beat:
    build: .
    command: celery -A EYK beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./:/app:rw
    env_file:
      - ./.env
    depends_on:
      - redis

volumes:
  static_volume:
  media_volume:
