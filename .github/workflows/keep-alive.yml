name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *' # GitHub Actions agenda em UTC; Render Free suspende após 15 min sem tráfego.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar ping para o backend
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 120 \
            --retry 2 --retry-all-errors --retry-delay 5 \
            https://eyk-1jrl.onrender.com/health/
