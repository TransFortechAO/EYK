<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <title>Registrar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/style/auth.css">
    <link rel="stylesheet" href="/style/auth.css">
</head>

<body>
    <div class="container-login d-flex">
        <div class="logo-login">
            <video src="/imagens/media/eyk-effet-panorama.mp4" autoplay loop muted playsinline
                disablePictureInPicture></video>
        </div>

        <div class="container mt-5">
            <h2 class="text-center">Registrar</h2>
            <form method="POST" action="" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="">Nome:</label>
                    <input type="text" class="form-control" name="" id="" value="" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" class="form-control" name="email" id="email" value="" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" class="form-control" name="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="password_confirmation">Confirmar Senha:</label>
                    <input type="password" class="form-control" name="password_confirmation" id="password_confirmation"
                        required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Registrar</button>
            </form>

            <div style="text-align:center; font-weight:bold;">
                Já tem uma conta? <br><a href="">Entra gratuitamente</a>
            </div>
        </div>
    </div>
</body>

</html>
