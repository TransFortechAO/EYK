<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Estilo personalizado -->
    <link rel="stylesheet" href="/style/auth.css">
    <link rel="stylesheet" href="/style/auth.css">
</head>

<body>
    <div class="container-login">
        <div class=logo-login><video src="/imagens/media/eyk-effet-panorama.mp4" autoplay loop muted playsinline
                disablePictureInPicture></video></div>
        <div class="container mt-5">
            <h2 class="text-center">Iniciar sessão</h2>
            <form method="POST" action="">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" class="form-control" id="email" name="email" value="" required>
                    <span class="text-danger"></span>
                </div>

                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                    <span class="text-danger"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            <div style="text-align:center;font-weight:bold;">Não tem uma conta ? <br><a href="" class="">Se inscreva
                    gratuitamente</a></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
