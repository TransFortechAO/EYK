{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <div class="p-4 bg-white rounded border text-center">
        <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
        <h4>Apagar utilizador?</h4>
        <p class="text-muted">
            Tens a certeza que queres apagar <strong>{{ utilizador.username }}</strong> ({{ utilizador.email }})?
            Esta ação é irreversível e remove também o perfil e dados associados.
        </p>
        <form method="post" class="d-flex justify-content-center gap-3 mt-3">
            {% csrf_token %}
            <a href="{% url 'accounts:dashboard-usuarios' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-danger">Sim, apagar</button>
        </form>
    </div>
</div>
{% endblock %}
