{% load static %}
<div class="card" style="padding:22px; margin-bottom:16px;">
    <h4 style="font-size:.95rem; margin-bottom:14px;"><i class="fas fa-sliders-h" style="color:var(--gold);"></i> Preferências</h4>
    <form method="POST" action="{% url 'accounts:atualizar-preferencias-notificacao' %}">
        {% csrf_token %}
        <p class="hint" style="margin-bottom:6px;">Notificações por email</p>
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
            <input type="checkbox" id="notif-novidades" name="notif_email_novidades" {% if user.notif_email_novidades %}checked{% endif %}>
            <label for="notif-novidades" style="margin:0; font-weight:500;">Novidades da plataforma</label>
        </div>
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
            <input type="checkbox" id="notif-comunidade" name="notif_email_comunidade" {% if user.notif_email_comunidade %}checked{% endif %}>
            <label for="notif-comunidade" style="margin:0; font-weight:500;">Atividade na comunidade</label>
        </div>
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
            <input type="checkbox" id="notif-gamificacao" name="notif_email_gamificacao" {% if user.notif_email_gamificacao %}checked{% endif %}>
            <label for="notif-gamificacao" style="margin:0; font-weight:500;">Gamificação (moedas, ofensiva, conquistas)</label>
        </div>
        <button type="submit" class="btn btn-outline btn-sm"><i class="fas fa-save"></i> Guardar preferências</button>
    </form>
</div>

<div class="card" style="padding:22px; margin-bottom:16px;">
    <h4 style="font-size:.95rem; margin-bottom:10px;"><i class="fas fa-shield-halved" style="color:var(--teal);"></i> Segurança</h4>
    {% if tem_2fa %}
        <p style="color:var(--teal); font-size:.85rem;"><i class="fas fa-check-circle"></i> Autenticação de dois fatores ativa.</p>
    {% else %}
        <p style="color:var(--ink-soft); font-size:.85rem;">Adiciona uma camada extra de segurança à tua conta.</p>
    {% endif %}
    <a href="{% url 'accounts:configurar-2fa' %}" class="btn btn-outline btn-sm"><i class="fas fa-mobile-alt"></i> {% if tem_2fa %}Gerir 2FA{% else %}Ativar 2FA{% endif %}</a>
</div>
