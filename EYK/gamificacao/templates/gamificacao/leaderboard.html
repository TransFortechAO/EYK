{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4"><i class="fas fa-trophy me-2 text-warning"></i>Leaderboard</h1>

{% if top_carteiras %}
<div class="list-group shadow-sm">
    {% for c in top_carteiras %}
    <div class="list-group-item d-flex justify-content-between align-items-center">
        <span><span class="fw-bold me-2">#{{ forloop.counter }}</span>{{ c.utilizador.username }}</span>
        <span class="fw-bold text-warning"><i class="fas fa-coins me-1"></i>{{ c.saldo }}</span>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="text-center py-5 bg-white rounded border">
    <p class="text-muted mb-0">Ainda não há dados suficientes.</p>
</div>
{% endif %}
{% endblock %}
