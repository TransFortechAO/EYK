{% extends 'base.html' %}
{% load static %}

{% block title %}Confirmar Eliminação | EYK{% endblock %}

{% block content %}
<div style="max-width:520px; margin:40px auto 0;">
    <div class="card" style="padding:32px; text-align:center; border-color:#f0bcae;">
        <i class="fas fa-exclamation-triangle" style="font-size:2.2rem; color:var(--coral);"></i>
        <h2 style="font-size:1.3rem; margin:14px 0 8px;">Confirmar Eliminação</h2>
        <p style="color:var(--ink-soft);">Tens a certeza que queres eliminar o {{ tipo }} <strong>"{{ objeto.titulo }}"</strong>?</p>
        <p style="color:var(--coral); font-size:.85rem;">Esta ação não pode ser revertida.</p>
        <div style="display:flex; justify-content:center; gap:12px; margin-top:20px;">
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Sim, eliminar</button>
            </form>
            <a href="{% url url_cancelar %}" class="btn btn-ghost">Cancelar</a>
        </div>
    </div>
</div>
{% endblock %}
