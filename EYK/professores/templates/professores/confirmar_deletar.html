{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
<div class="col-md-6">
    <div class="card shadow-sm border-danger">
        <div class="card-body p-4 text-center">
            <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
            <h3>Confirmar Eliminação</h3>
            <p class="text-muted">Tens a certeza que queres eliminar o {{ tipo }} <strong>"{{ objeto.titulo }}"</strong>?</p>
            <p class="text-danger small">Esta acção não pode ser revertida.</p>
            <div class="d-flex justify-content-center gap-3 mt-4">
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="fas fa-trash me-1"></i>Sim, eliminar
                    </button>
                </form>
                <a href="{% url url_cancelar %}" class="btn btn-outline-secondary px-4">Cancelar</a>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock %}
