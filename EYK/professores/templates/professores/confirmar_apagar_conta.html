{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
<div class="col-md-5">
    <div class="card shadow-sm border-danger">
        <div class="card-body p-4 text-center">
            <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
            <h3>Apagar Conta</h3>
            <p class="text-muted">Tens a certeza? Todos os teus cursos, vídeos e dados serão eliminados permanentemente.</p>
            <div class="d-flex justify-content-center gap-3 mt-4">
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="fas fa-trash me-1"></i>Sim, apagar
                    </button>
                </form>
                <a href="{% url 'professores:configuracoes' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock %}
